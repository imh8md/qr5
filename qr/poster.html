<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوحة طلب التسعيرة — القرعاوي</title>
<style>
@font-face{font-family:'Thmanyah Sans';font-weight:400;src:url(../assets/fonts/thmanyahsans-Regular.woff2) format('woff2')}
@font-face{font-family:'Thmanyah Sans';font-weight:700;src:url(../assets/fonts/thmanyahsans-Bold.woff2) format('woff2')}
@font-face{font-family:'Thmanyah Sans';font-weight:900;src:url(../assets/fonts/thmanyahsans-Black.woff2) format('woff2')}
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:210mm;height:297mm}
body{font-family:'Thmanyah Sans',Tahoma,sans-serif;color:#1f1e1b;background:#ffffff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}
.bar{width:100%;height:9mm;background:#c0392b;flex:none}
.logo{height:30mm;margin-top:11mm}
.badge{margin-top:5mm;background:#fbeae8;color:#c0392b;font-weight:700;font-size:15pt;padding:2.5mm 9mm;border-radius:20mm}
h1{font-weight:900;font-size:34pt;line-height:1.2;margin-top:4mm}
h1 span{color:#c0392b}
.sub{font-size:14.5pt;color:#8a8175;margin-top:3mm;max-width:150mm;line-height:1.5}
.qrbox{margin-top:7mm;background:#fff;border:1.2mm solid #1f1e1b;border-radius:8mm;padding:7mm}
.qrbox img{width:78mm;height:78mm;display:block}
.scan{margin-top:5mm;font-weight:900;font-size:18pt}
.steps{display:flex;gap:6mm;margin-top:7mm}
.step{width:52mm;background:#f5f4ef;border:0.4mm solid #e5e2d8;border-radius:5mm;padding:4mm 3mm}
.step b{display:flex;align-items:center;justify-content:center;width:10mm;height:10mm;border-radius:50%;background:#c0392b;color:#fff;font-size:14pt;margin:0 auto 2mm}
.step span{font-size:12.5pt;line-height:1.4;font-weight:700}
.url{position:absolute;bottom:14mm;font-size:13pt;color:#8a8175;direction:ltr}
.foot{position:absolute;bottom:0;width:100%;height:9mm;background:#1f1e1b}
</style>
</head>
<body>
<div class="page">
  <div class="bar"></div>
  <img class="logo" src="../assets/logo.png" alt="القرعاوي">
  <div class="badge">طلب تسعيرة</div>
  <h1>اطلب تسعيرة<br>قطع سيارتك من <span>القرعاوي</span></h1>
  <p class="sub">امسح الرمز، اختر القطع اللي تحتاجها، ويوصلك السعر على الواتساب</p>
  <div class="qrbox"><img src="quote-qr.png" alt="رمز QR لصفحة التسعيرة"></div>
  <div class="scan">امسح بكاميرا جوالك 📱</div>
  <div class="steps">
    <div class="step"><b>١</b><span>اكتب بيانات سيارتك</span></div>
    <div class="step"><b>٢</b><span>اختر القطع والكمية</span></div>
    <div class="step"><b>٣</b><span>يوصلك السعر بالواتساب</span></div>
  </div>
  <div class="url">www.qrawi.com/quote.html</div>
  <div class="foot"></div>
</div>
</body>
</html>
